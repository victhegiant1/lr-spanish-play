<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spanish Game Mode</title><style>body{margin:0;font-family:system-ui;background:#f7f1fb;color:#24162d}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 10px 26px #3a1d5918}.hero{background:linear-gradient(135deg,#56267c,#9a6bc3);color:#fff}.btn{border:0;border-radius:14px;padding:12px 16px;background:#3a1d59;color:#fff;font-weight:800}.alt{background:#eadcf7;color:#3a1d59}.field{width:100%;padding:12px;border:1px solid #d9c8e8;border-radius:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none}.room{font-size:38px;font-weight:900;letter-spacing:.12em}.question{font-size:34px;font-weight:900;text-align:center;margin:22px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{border:2px solid #e1d5ea;background:#fff;border-radius:18px;padding:18px;font-size:20px;font-weight:800}.pic{font-size:52px;display:block}.timer{font-size:34px;font-weight:900;text-align:center}.status{font-weight:800;margin-top:10px}.tiny{font-size:13px;color:#706276}.pill{display:inline-block;background:#efe5f8;color:#3a1d59;border-radius:999px;padding:8px 12px;font-weight:800}.record{margin-top:14px;padding:14px;border-radius:16px;background:#faf6fd}.recordrow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #eee6f4}.recordrow:last-child{border-bottom:0}.good{color:#2b7a4b}.bad{color:#ad4352}@media(max-width:650px){.grid,.answers{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card hero"><h1>Spanish Game Mode</h1><p>Same concept, easier picture/listening questions for Lawson-Rae and harder A1–A2 questions for Victoria.</p></div><div id="connect" class="card"><div class="grid"><div><h3>Create room</h3><select id="adultTimer" class="field"><option value="10">Victoria: 10 sec</option><option value="15" selected>Victoria: 15 sec</option><option value="20">Victoria: 20 sec</option></select><select id="childTimer" class="field" style="margin-top:8px"><option value="20">Lawson-Rae: 20 sec</option><option value="25" selected>Lawson-Rae: 25 sec</option><option value="30">Lawson-Rae: 30 sec</option></select><button id="createBtn" class="btn" style="margin-top:10px">Create room</button></div><div><h3>Join room</h3><input id="joinCode" class="field" maxlength="6" placeholder="Room code"><button id="joinBtn" class="btn alt" style="margin-top:10px">Join as Lawson-Rae</button></div></div><div id="connectMsg" class="status"></div><div class="record"><b>🏆 Game Record</b><div id="recordSummary" class="tiny" style="margin-top:6px">Loading wins…</div><div id="recordList"></div></div></div><div id="lobby" class="card hidden"><div class="tiny">ROOM CODE</div><div id="roomCode" class="room">------</div><div class="grid"><div><b>Victoria</b><div>Connected ✓</div></div><div><b>Lawson-Rae</b><div id="childReady">Waiting…</div></div></div><button id="startBtn" class="btn" style="margin-top:14px" disabled>Start game</button></div><div id="game" class="card hidden"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><div><span class="pill" id="adultScore">Victoria 0</span> <span class="pill" id="childScore">Lawson-Rae 0</span></div><div id="timer" class="timer">15</div></div><div style="text-align:center;margin-top:12px"><button id="speakBtn" class="btn alt">🔊 Hear question</button></div><div id="question" class="question"></div><div id="sub" class="tiny" style="text-align:center"></div><div id="answers" class="answers"></div><div id="answerStatus" class="status" style="text-align:center"></div></div><div id="finish" class="card hidden"><h2>Game complete!</h2><div id="finishScores"></div><button class="btn" onclick="location.reload()" style="margin-top:14px">Play again</button></div></div><script>
const $=id=>document.getElementById(id),base='https://the-game-f6046-default-rtdb.firebaseio.com';
const concepts=[
{k:'pollo',adult:{q:'¿Qué significa “pollo”?',a:['Chicken','Rice','Soup','Bread'],c:0,s:'¿Qué significa pollo?'},child:{q:'¿Cuál es el pollo?',a:[['🐔','Chicken'],['🍚','Rice'],['🥣','Soup'],['🍞','Bread']],c:0,s:'¿Cuál es el pollo?'}},
{k:'camisa',adult:{q:'Translate: “the shirt”',a:['la camisa','los zapatos','los pantalones','el vestido'],c:0,s:'La camisa'},child:{q:'¿Dónde está la camisa?',a:[['👕','Shirt'],['👟','Shoes'],['👖','Pants'],['👗','Dress']],c:0,s:'¿Dónde está la camisa?'}},
{k:'comer',adult:{q:'Nosotros ___ pollo. (comer)',a:['comemos','comen','comes','como'],c:0,s:'Nosotros comemos pollo.'},child:{q:'¿Qué significa “comer”?',a:[['🍽️','Eat'],['😴','Sleep'],['🏃','Run'],['📖','Read']],c:0,s:'Comer. To eat.'}},
{k:'beber',adult:{q:'Yo ___ agua. (beber)',a:['bebo','bebes','bebe','bebemos'],c:0,s:'Yo bebo agua.'},child:{q:'¿Qué significa “beber”?',a:[['🥤','Drink'],['🍽️','Eat'],['😴','Sleep'],['✏️','Write']],c:0,s:'Beber. To drink.'}},
{k:'zapatos',adult:{q:'¿Qué significa “los zapatos”?',a:['Shoes','Shirt','Socks','Hat'],c:0,s:'Los zapatos'},child:{q:'¿Dónde están los zapatos?',a:[['👟','Shoes'],['👕','Shirt'],['🧦','Socks'],['🧢','Hat']],c:0,s:'¿Dónde están los zapatos?'}},
{k:'arroz',adult:{q:'Translate: “I eat rice.”',a:['Como arroz.','Bebo arroz.','Vivo arroz.','Tengo arroz.'],c:0,s:'Como arroz.'},child:{q:'¿Cuál es el arroz?',a:[['🍚','Rice'],['🍕','Pizza'],['🍎','Apple'],['🥛','Milk']],c:0,s:'¿Cuál es el arroz?'}},
{k:'feliz',adult:{q:'Estoy ___. Choose “happy.”',a:['feliz','triste','cansada','enojada'],c:0,s:'Estoy feliz.'},child:{q:'¿Quién está feliz?',a:[['😊','Happy'],['😢','Sad'],['😡','Angry'],['😴','Tired']],c:0,s:'¿Quién está feliz?'}},
{k:'tener',adult:{q:'Mi hijo ___ seis años. (tener)',a:['tiene','tengo','tenemos','tienen'],c:0,s:'Mi hijo tiene seis años.'},child:{q:'Tengo seis años.',a:[['6️⃣','Six'],['5️⃣','Five'],['7️⃣','Seven'],['8️⃣','Eight']],c:0,s:'Tengo seis años.'}},
{k:'manzana',adult:{q:'Translate: “an apple”',a:['una manzana','una naranja','una fresa','una pera'],c:0,s:'Una manzana'},child:{q:'¿Cuál es la manzana?',a:[['🍎','Apple'],['🍊','Orange'],['🍓','Strawberry'],['🍐','Pear']],c:0,s:'¿Cuál es la manzana?'}},
{k:'leche',adult:{q:'Quiero ___ con el desayuno.',a:['leche','camisa','perro','libro'],c:0,s:'Quiero leche con el desayuno.'},child:{q:'¿Dónde está la leche?',a:[['🥛','Milk'],['💧','Water'],['🍎','Apple'],['🍞','Bread']],c:0,s:'¿Dónde está la leche?'}},
{k:'perro',adult:{q:'¿Qué significa “perro”?',a:['Dog','Cat','Bird','Horse'],c:0,s:'Perro'},child:{q:'¿Cuál es el perro?',a:[['🐶','Dog'],['🐱','Cat'],['🐦','Bird'],['🐴','Horse']],c:0,s:'¿Cuál es el perro?'}},
{k:'gato',adult:{q:'Translate: “the cat”',a:['el gato','el perro','el pez','el oso'],c:0,s:'El gato'},child:{q:'¿Dónde está el gato?',a:[['🐱','Cat'],['🐶','Dog'],['🐟','Fish'],['🐻','Bear']],c:0,s:'¿Dónde está el gato?'}},
{k:'azul',adult:{q:'El cielo es ___. Choose “blue.”',a:['azul','verde','rojo','amarillo'],c:0,s:'El cielo es azul.'},child:{q:'¿Cuál es azul?',a:[['🔵','Blue'],['🟢','Green'],['🔴','Red'],['🟡','Yellow']],c:0,s:'¿Cuál es azul?'}},
{k:'verde',adult:{q:'¿Qué significa “verde”?',a:['Green','Purple','Blue','Orange'],c:0,s:'Verde'},child:{q:'¿Cuál es verde?',a:[['🟢','Green'],['🟣','Purple'],['🔵','Blue'],['🟠','Orange']],c:0,s:'¿Cuál es verde?'}},
{k:'leer',adult:{q:'Ella ___ un libro. (leer)',a:['lee','leo','leen','lees'],c:0,s:'Ella lee un libro.'},child:{q:'¿Qué significa “leer”?',a:[['📖','Read'],['✏️','Write'],['🏃','Run'],['😴','Sleep']],c:0,s:'Leer. To read.'}},
{k:'jugar',adult:{q:'Mi hijo ___ después de la escuela. (jugar)',a:['juega','juego','jugamos','juegan'],c:0,s:'Mi hijo juega después de la escuela.'},child:{q:'¿Qué significa “jugar”?',a:[['🎮','Play'],['📖','Read'],['🍽️','Eat'],['😴','Sleep']],c:0,s:'Jugar. To play.'}},
{k:'casa',adult:{q:'Trabajo en ___. Choose “home.”',a:['casa','escuela','parque','tienda'],c:0,s:'Trabajo en casa.'},child:{q:'¿Cuál es la casa?',a:[['🏠','House'],['🏫','School'],['🌳','Park'],['🏪','Store']],c:0,s:'¿Cuál es la casa?'}},
{k:'escuela',adult:{q:'Mi hijo va a la ___.',a:['escuela','cocina','biblioteca','tienda'],c:0,s:'Mi hijo va a la escuela.'},child:{q:'¿Dónde está la escuela?',a:[['🏫','School'],['🏠','House'],['📚','Library'],['🏪','Store']],c:0,s:'¿Dónde está la escuela?'}}
];
let role=null,room=null,data=null,shownRound=-1,answered=false,timer=null,poll=null,advanceLock=false;
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-US';u.rate=.82;speechSynthesis.speak(u)}catch(e){}}
function code(){return Math.random().toString(36).slice(2,8).toUpperCase()}function url(path=''){return base+'/rooms/'+room+path+'.json'}function globalUrl(path=''){return base+path+'.json'}
async function req(method,path,val){const opts={method,headers:{'Content-Type':'application/json'}};if(val!==undefined)opts.body=JSON.stringify(val);const r=await fetch(url(path),opts);if(!r.ok)throw Error('db');return r.status===204?null:r.json()}
const put=(p,v)=>req('PUT',p,v),patch=(p,v)=>req('PATCH',p,v),read=(p='')=>req('GET',p);async function globalReq(method,path,val){const opts={method,headers:{'Content-Type':'application/json'}};if(val!==undefined)opts.body=JSON.stringify(val);const r=await fetch(globalUrl(path),opts);if(!r.ok)throw Error('db');return r.status===204?null:r.json()}
function msg(t,b=false){$('connectMsg').className='status '+(b?'bad':'good');$('connectMsg').textContent=t}
$('createBtn').onclick=async()=>{room=code();role='adult';const rounds=[...concepts].sort(()=>Math.random()-.5).slice(0,8).map(x=>x.k);data={status:'lobby',current:0,rounds,settings:{adultTimer:+$('adultTimer').value,childTimer:+$('childTimer').value},players:{adult:{joined:true,score:0},child:{joined:false,score:0}},answers:{},scored:{}};try{await put('',data);$('connect').classList.add('hidden');$('lobby').classList.remove('hidden');$('roomCode').textContent=room;watch()}catch(e){msg('Could not create room. Check Firebase test mode.',true)}};
$('joinBtn').onclick=async()=>{room=$('joinCode').value.trim().toUpperCase();role='child';try{data=await read();if(!data)return msg('Room not found.',true);await patch('/players/child',{joined:true,score:data.players?.child?.score||0});$('connect').classList.add('hidden');$('lobby').classList.remove('hidden');$('roomCode').textContent=room;watch()}catch(e){msg('Could not join room.',true)}};
$('startBtn').onclick=()=>patch('',{status:'playing',current:0});$('speakBtn').onclick=()=>{const c=getConcept();if(c)speak(c[role].s)};
function watch(){clearInterval(poll);poll=setInterval(async()=>{try{const latest=await read();if(!latest)return;data=latest;$('childReady').textContent=data.players?.child?.joined?'Connected ✓':'Waiting…';$('startBtn').disabled=!data.players?.child?.joined;if(data.status==='playing'){showGame();await maybeAdvance()}else if(data.status==='finished')showFinish()}catch(e){}},600)}
function getConcept(){const k=data?.rounds?.[data.current];return concepts.find(x=>x.k===k)}
function showGame(){$('lobby').classList.add('hidden');$('game').classList.remove('hidden');if(shownRound===data.current)return;shownRound=data.current;answered=false;renderRound()}
function renderRound(){clearInterval(timer);const q=getConcept()?.[role];if(!q)return;$('adultScore').textContent='Victoria '+(data.players?.adult?.score||0);$('childScore').textContent='Lawson-Rae '+(data.players?.child?.score||0);$('question').textContent=q.q;$('sub').textContent=role==='child'?'Listen, then choose the picture or answer.':'';$('answerStatus').textContent='';$('answers').innerHTML='';q.a.forEach((a,i)=>{const b=document.createElement('button');b.className='answer';b.innerHTML=role==='child'?`<span class="pic">${a[0]}</span>${a[1]}`:a;b.onclick=()=>answer(i,b);$('answers').appendChild(b)});const seconds=role==='child'?(Number(data.settings?.childTimer)||25)+3:(Number(data.settings?.adultTimer)||15);startTimer(seconds);speak(q.s)}
function startTimer(n){clearInterval(timer);let left=Number(n)||15;$('timer').textContent=left;timer=setInterval(()=>{if(answered){clearInterval(timer);return}left-=1;$('timer').textContent=Math.max(0,left);if(left<=0){clearInterval(timer);answer(-1)}},1000)}
async function answer(i,b){if(answered)return;answered=true;clearInterval(timer);const roundNum=data.current,q=getConcept()[role],ok=i===q.c;if(b)b.style.background=ok?'#e1f3e7':'#fde6ea';[...$('answers').children].forEach(x=>x.disabled=true);$('answerStatus').textContent=ok?'Correct! Waiting for the other player…':'Correct answer: '+(role==='child'?q.a[q.c][1]:q.a[q.c])+' • Waiting for the other player…';const p=role==='adult'?'adult':'child';try{await put(`/answers/${roundNum}/${p}`,{correct:ok,points:ok?100:0});setTimeout(maybeAdvance,150)}catch(e){$('answerStatus').textContent='Answer could not sync. Try again.';answered=false}}
async function maybeAdvance(){if(advanceLock||!room)return;advanceLock=true;try{const latest=await read();if(!latest||latest.status!=='playing')return;const cur=latest.current;if(latest.scored?.[cur])return;const a=latest.answers?.[cur];if(!a?.adult||!a?.child)return;const adultScore=(latest.players?.adult?.score||0)+(a.adult.points||0),childScore=(latest.players?.child?.score||0)+(a.child.points||0),next=cur+1;await put(`/scored/${cur}`,true);if(next>=latest.rounds.length){const winner=adultScore===childScore?'Tie':adultScore>childScore?'Victoria':'Lawson-Rae';const endedAt=Date.now();await patch('',{status:'finished',winner,endedAt,players:{adult:{joined:true,score:adultScore},child:{joined:true,score:childScore}}});try{await globalReq('PUT','/history/'+endedAt+'-'+room,{room,winner,victoria:adultScore,lawsonRae:childScore,endedAt})}catch(e){}}else{await patch('',{current:next,players:{adult:{joined:true,score:adultScore},child:{joined:true,score:childScore}}})}}catch(e){}finally{advanceLock=false}}
function showFinish(){clearInterval(timer);$('game').classList.add('hidden');$('lobby').classList.add('hidden');$('finish').classList.remove('hidden');const a=data.players?.adult?.score||0,l=data.players?.child?.score||0,w=data.winner||(a===l?'Tie':a>l?'Victoria':'Lawson-Rae');$('finishScores').innerHTML=`<h3>🏆 ${w==='Tie'?'Tie game!':w+' wins!'}</h3><span class="pill">Victoria ${a}</span> <span class="pill">Lawson-Rae ${l}</span>`;loadHistory()}async function loadHistory(){try{const h=await globalReq('GET','/history');const arr=h?Object.values(h).sort((a,b)=>(b.endedAt||0)-(a.endedAt||0)):[];let vw=0,lw=0,ties=0;arr.forEach(x=>x.winner==='Victoria'?vw++:x.winner==='Lawson-Rae'?lw++:ties++);$('recordSummary').textContent=`Victoria ${vw} wins • Lawson-Rae ${lw} wins • ${ties} ties`;$('recordList').innerHTML=arr.slice(0,5).map(x=>`<div class="recordrow"><span>${x.winner==='Tie'?'🤝 Tie':'🏆 '+x.winner}</span><span>${x.victoria}–${x.lawsonRae}</span></div>`).join('')||'<div class="tiny" style="margin-top:8px">No finished games yet.</div>'}catch(e){$('recordSummary').textContent='Record will appear after completed games.'}}loadHistory();
</script></body></html>
