const V={colors:[['rojo','red','🔴'],['azul','blue','🔵'],['verde','green','🟢'],['amarillo','yellow','🟡'],['morado','purple','🟣']],numbers:[['uno','one','1️⃣'],['dos','two','2️⃣'],['tres','three','3️⃣'],['cuatro','four','4️⃣'],['cinco','five','5️⃣'],['seis','six','6️⃣'],['siete','seven','7️⃣'],['ocho','eight','8️⃣'],['nueve','nine','9️⃣'],['diez','ten','🔟']],verbs:[['corre','run','🏃'],['salta','jump','🤸'],['come','eat','🍎'],['bebe','drink','🥤'],['mira','look','👀'],['duerme','sleep','😴'],['lee','read','📚'],['juega','play','🧸']],food:[['manzana','apple','🍎'],['pan','bread','🍞'],['leche','milk','🥛'],['pollo','chicken','🍗'],['arroz','rice','🍚'],['queso','cheese','🧀'],['agua','water','💧'],['fresa','strawberry','🍓']],weather:[['hace sol','sunny','☀️'],['llueve','raining','🌧️'],['nieva','snowing','❄️'],['hace frío','cold','🥶'],['hace calor','hot','🥵']],family:[['mamá','mom','👩'],['papá','dad','👨'],['abuela','grandma','👵'],['abuelo','grandpa','👴'],['familia','family','👨‍👩‍👦']],body:[['cabeza','head','🙂'],['mano','hand','✋'],['pie','foot','🦶'],['ojos','eyes','👀'],['nariz','nose','👃'],['boca','mouth','👄']],animals:[['perro','dog','🐶'],['gato','cat','🐱'],['pájaro','bird','🐦'],['pez','fish','🐟'],['caballo','horse','🐴'],['oso','bear','🐻']]};
let S=Number(localStorage.lrStars||0),X=document.getElementById('screen'),H=document.getElementById('home');let days=JSON.parse(localStorage.lrDays||'[]');let world=JSON.parse(localStorage.lrWorld||'null')||{unlocked:1,flames:{}};let prizesList=JSON.parse(localStorage.lrPrizes||'null')||[{n:'Pick bedtime story',c:8},{n:'Choose family game',c:10},{n:'Pick dessert',c:12},{n:'10 bonus screen minutes',c:15},{n:'Choose movie night',c:20},{n:'Small prize-bin surprise',c:25}];let pin=localStorage.lrParentPin||'';let recUrl=null,recorder=null,chunks=[],sayTarget=null;
function save(){localStorage.lrStars=S;localStorage.lrDays=JSON.stringify(days);localStorage.lrWorld=JSON.stringify(world);localStorage.lrPrizes=JSON.stringify(prizesList);stars.textContent=S;levelText.innerHTML='<b>Level '+Math.min(8,1+Math.floor(S/25))+'</b>';renderHomeCalendar()}function show(h){H.classList.add('hidden');X.classList.remove('hidden');X.innerHTML=h}function back(){X.classList.add('hidden');H.classList.remove('hidden');markDay();save()}function es(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-MX';u.rate=.76;speechSynthesis.speak(u)}function en(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.84;speechSynthesis.speak(u)}function sh(a){return [...a].sort(()=>Math.random()-.5)}function flat(){return Object.values(V).flat()}function strip(t){return t.normalize('NFD').replace(/[\u0300-\u036f]/g,'')}function win(n=1){S+=n;markDay();save();alert('⭐ Great job! +'+n+' star'+(n>1?'s':''))}
function keyToday(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function markDay(){let k=keyToday();if(!days.includes(k)){days.push(k);if(days.length>90)days=days.slice(-90)}}function streak(){let n=0,d=new Date();for(let i=0;i<100;i++){let k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(days.includes(k)){n++;d.setDate(d.getDate()-1)}else break}return n}function renderHomeCalendar(){streakNum.textContent=streak();let c=document.getElementById('miniCalendar');if(!c)return;c.innerHTML='';let now=new Date(),y=now.getFullYear(),m=now.getMonth(),last=new Date(y,m+1,0).getDate(),start=new Date(y,m,1).getDay();for(let i=0;i<start;i++){let z=document.createElement('div');c.appendChild(z)}for(let d=1;d<=last;d++){let q=document.createElement('div');q.className='calday';let k=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');if(days.includes(k))q.classList.add('done');if(d===now.getDate())q.classList.add('today');q.textContent=d;c.appendChild(q)}}
const week=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'],months=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];function todayPhrase(){let d=new Date();return 'Hoy es '+week[d.getDay()]+', '+d.getDate()+' de '+months[d.getMonth()]+' de '+d.getFullYear()+'.'}todaySpanish.textContent=todayPhrase();function speakToday(){es(todayPhrase());markDay();save()}
function calendarMode(){let d=new Date();show(`<div class="card"><button class="btn purple" onclick="back()">← Home</button><h2>📅 Calendar Spanish</h2><div class="note">Tap anything to hear it in Spanish.</div><h3>Days of the week</h3><div class="grid" id="w"></div><h3>Months</h3><div class="grid" id="m"></div><h3>Calendar words</h3><div class="grid"><button class="btn blue" onclick="es('hoy')">hoy<br><span class="small">today</span></button><button class="btn blue" onclick="es('ayer')">ayer<br><span class="small">yesterday</span></button><button class="btn blue" onclick="es('mañana')">mañana<br><span class="small">tomorrow</span></button><button class="btn blue" onclick="es('año')">año<br><span class="small">year</span></button></div><h3>Today</h3><button class="btn green big" onclick="es('${todayPhrase()}')">🔊 ${todayPhrase()}</button></div>`);week.forEach(x=>{let b=document.createElement('button');b.className='btn green';b.textContent=x;b.onclick=()=>es(x);w.appendChild(b)});months.forEach(x=>{let b=document.createElement('button');b.className='btn blue';b.textContent=x;b.onclick=()=>es(x);m.appendChild(b)})}
function topics(){show('<div class="card"><button class="btn purple" onclick="back()">← Home</button><h2>Choose a topic</h2><div class="grid" id="tg"></div></div>');Object.keys(V).forEach(k=>{let b=document.createElement('button');b.className='btn blue';b.textContent=({colors:'🎨 Colors',numbers:'🔢 Numbers',verbs:'🏃 Verbs',food:'🍎 Food',weather:'🌦️ Weather',family:'👨‍👩‍👦 Family',body:'🖐️ Body',animals:'🐶 Animals'})[k];b.onclick=()=>lesson(k,0);tg.appendChild(b)})}function lesson(k,i){let x=V[k][i];show(`<div class="card"><button class="btn purple" onclick="topics()">← Topics</button><div class="emoji">${x[2]}</div><div class="word">${x[0]}</div><p class="center small">${x[1]}</p><button class="btn blue big" onclick="es('${x[0]}')">🔊 Hear it</button><p class="center">Say it out loud.</p><button class="btn green big" id="nxt">I said it! ⭐</button></div>`);nxt.onclick=()=>{S++;markDay();save();i+1<V[k].length?lesson(k,i+1):topics()}}
function practice(){let x=sh(flat())[0],pool=sh([x,...sh(flat().filter(y=>y[0]!=x[0])).slice(0,3)]);show(`<div class="card"><button class="btn purple" onclick="back()">← Home</button><h2 class="center">Which one means “${x[0]}”?</h2><p class="center small">${x[1]}</p><div class="answergrid" id="ag"></div><button class="btn blue big" onclick="es('${x[0]}')">🔊 Repeat</button></div>`);pool.forEach(y=>{let b=document.createElement('button');b.className='btn ans';b.innerHTML=`<span style="font-size:2rem">${y[2]}</span><br>${y[1]}`;b.onclick=()=>{if(y[0]==x[0]){b.classList.add('ok');win();setTimeout(practice,450)}else{b.classList.add('no');setTimeout(()=>b.classList.remove('no'),450)}};ag.appendChild(b)})}
let typeObj,typeVal='';function typing(){typeObj=sh(flat().filter(x=>x[0].length<9&&!x[0].includes(' ')))[0];typeVal='';let target=strip(typeObj[0]),letters=sh([...new Set((target+'aeioubcdfglnmprstv').split(''))]).slice(0,14);target.split('').forEach(l=>{if(!letters.includes(l))letters.push(l)});show(`<div class="card"><button class="btn purple" onclick="back()">← Home</button><div class="emoji">${typeObj[2]}</div><h2 class="center">Build the Spanish word</h2><p class="center small">${typeObj[1]} • Copy: ${typeObj[0]}</p><div class="word" id="tb">${'_ '.repeat(target.length)}</div><div class="bank" id="kb"></div><div class="row"><button class="btn red" onclick="typeVal=typeVal.slice(0,-1);tb.textContent=typeVal">⌫</button><button class="btn green" onclick="if(typeVal=='${target}'){win(2);typing()}else alert('Try again 🙂')">Check ⭐</button><button class="btn blue" onclick="es('${typeObj[0]}')">🔊</button></div></div>`);sh(letters).forEach(l=>{let b=document.createElement('button');b.className='chip';b.textContent=l;b.onclick=()=>{typeVal+=l;tb.textContent=typeVal};kb.appendChild(b)})}
const storyBits={who:[['El niño','👦'],['La niña','👧'],['El perro','🐶'],['El gato','🐱']],verb:[['come','🍎'],['mira','👀'],['lleva','🎒'],['encuentra','🔎']],thing:[['una manzana','🍎'],['un libro','📘'],['una pelota','⚽'],['un juguete','🧸']],where:[['en la casa','🏠'],['en el parque','🌳'],['en la escuela','🏫'],['en Canadá','🍁']]};let picked={};function story(){picked={};show('<div class="card"><button class="btn purple" onclick="back()">← Home</button><h2>📖 Build a Picture Story</h2><div id="sa"></div><div id="so" class="word">Pick your pictures!</div><div class="row"><button class="btn blue" onclick="es(so.textContent)">🔊 Read it</button><button class="btn green" onclick="if(Object.keys(picked).length==4)win(3)">I said it! ⭐</button></div></div>');Object.entries(storyBits).forEach(([k,a])=>{let h=document.createElement('h3');h.textContent=k;sa.appendChild(h);let g=document.createElement('div');g.className='grid';a.forEach(x=>{let b=document.createElement('button');b.className='btn blue';b.innerHTML=x[1]+'<br>'+x[0];b.onclick=()=>{picked[k]=x[0];so.textContent=[picked.who,picked.verb,picked.thing,picked.where].filter(Boolean).join(' ')};g.appendChild(b)});sa.appendChild(g)})}
const sents=[{en:'The boy eats an apple.',es:['El niño','come','una manzana']},{en:'The dog drinks water.',es:['El perro','bebe','agua']},{en:'The girl reads a book.',es:['La niña','lee','un libro']},{en:'Mom eats rice.',es:['Mamá','come','arroz']},{en:'The boy plays in the house.',es:['El niño','juega','en la casa']}];let cur,built=[];function sentence(){cur=sh(sents)[0];built=[];show(`<div class="card"><button class="btn purple" onclick="back()">← Home</button><h2>🧩 Build the Spanish Sentence</h2><div class="note">Tap each Spanish card to hear it, then build the sentence.</div><h2 class="center">${cur.en}</h2><button class="btn blue big" onclick="en('${cur.en.replace(/'/g,"\\'")}')">🔊 Hear English</button><div class="bank" id="bank"></div><div class="drop" id="drop"></div><div class="row"><button class="btn red" onclick="sentence()">Clear</button><button class="btn green" onclick="if(JSON.stringify(built)==JSON.stringify(cur.es)){win(3);sentence()}else alert('Try the order again')">Check ⭐</button><button class="btn blue" onclick="es(built.join(' '))">🔊 Hear mine</button></div></div>`);let extras=sh(flat().map(x=>x[0]).filter(x=>!cur.es.includes(x))).slice(0,2);sh([...cur.es,...extras]).forEach(w=>{let b=document.createElement('button');b.className='chip';b.textContent=w;b.onclick=()=>{es(w);if(!b.classList.contains('used')){built.push(w);b.classList.add('used');let q=document.createElement('button');q.className='chip';q.textContent=w;q.onclick=()=>{let i=built.indexOf(w);if(i>-1)built.splice(i,1);b.classList.remove('used');q.remove()};drop.appendChild(q)}};bank.appendChild(b)})}
function sayit(){sayTarget=sh(flat())[0];show(`<div class="card"><button class="btn purple" onclick="back()">← Home</button><div class="emoji">${sayTarget[2]}</div><div class="word">${sayTarget[0]}</div><p class="center small">${sayTarget[1]}</p><button class="btn blue big" onclick="es('${sayTarget[0]}')">🔊 Hear it</button><div class="card" style="background:#f6f8fb"><div id="rs" class="center small">Record yourself and listen back.</div><div class="row"><button class="btn red" onclick="startRec()">⏺ Record</button><button class="btn purple" onclick="stopRec()">⏹ Stop</button><button class="btn green" onclick="playRec()">▶️ Hear Me</button></div></div><div class="row"><button class="btn gold" onclick="speechCheck()">✨ Check pronunciation</button><button class="btn green" onclick="win();sayit()">Next →</button></div></div>`)}async function startRec(){try{let st=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(st);recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{let blob=new Blob(chunks,{type:chunks[0]?.type||'audio/webm'});recUrl=URL.createObjectURL(blob);st.getTracks().forEach(t=>t.stop());rs.textContent='Recorded! Tap Hear Me.'};recorder.start();rs.textContent='Listening… speak now!'}catch(e){rs.textContent='Microphone permission is needed.'}}function stopRec(){if(recorder&&recorder.state!='inactive')recorder.stop()}function playRec(){if(recUrl)new Audio(recUrl).play()}function speechCheck(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Automatic speech checking is not available in this browser. Listening back still counts!');return}let r=new SR();r.lang='es-MX';r.maxAlternatives=3;r.onresult=e=>{let heard=[...e.results[0]].map(x=>strip(x.transcript.toLowerCase())),target=strip(sayTarget[0].toLowerCase());if(heard.some(x=>x.includes(target)||target.includes(x))){win(2);alert('🔥 Great pronunciation bonus!')}else alert('Good try! Hear it again and repeat.')};r.start()}
function games(){show('<div class="card"><button class="btn purple" onclick="back()">← Home</button><h2>🎮 Games</h2><div class="grid"><button class="btn gold" onclick="physical()">🔎 Spanish Hunt</button><button class="btn green" onclick="simon()">🕺 Simón Dice</button><button class="btn blue" onclick="practice()">⚡ Fast Pick</button><button class="btn pink" onclick="sentence()">🧩 Sentence Puzzle</button></div></div>')}function physical(){let a=[['Encuentra algo azul.','Find something blue.'],['Encuentra algo verde.','Find something green.'],['Trae tres juguetes.','Bring three toys.'],['Busca algo pequeño.','Find something small.']],x=sh(a)[0];show(`<div class="card"><button class="btn purple" onclick="games()">← Games</button><div class="emoji">🔎</div><div class="word">${x[0]}</div><p class="center small">${x[1]}</p><button class="btn blue big" onclick="es('${x[0]}')">🔊 Hear it</button><button class="btn green big" onclick="win(2);physical()">Done! ⭐⭐</button></div>`)}function simon(){let a=[['Simón dice: salta tres veces.','jump three times'],['Simón dice: toca tu cabeza.','touch your head'],['Simón dice: levanta una mano.','raise one hand']],x=sh(a)[0];show(`<div class="card"><button class="btn purple" onclick="games()">← Games</button><div class="emoji">🕺</div><div class="word">${x[0]}</div><p class="center small">${x[1]}</p><button class="btn blue big" onclick="es('${x[0]}')">🔊 Hear it</button><button class="btn green big" onclick="win(2);simon()">I did it!</button></div>`)}
const HOL={christmas:[['Navidad','Christmas','🎄'],['regalo','gift','🎁'],['árbol','tree','🌲'],['luces','lights','✨'],['Feliz Navidad','Merry Christmas','🎅']],thanksgiving:[['pavo','turkey','🦃'],['gracias','thank you','🙏'],['familia','family','👨‍👩‍👦'],['comida','food','🍽️']],birthday:[['cumpleaños','birthday','🎂'],['pastel','cake','🍰'],['vela','candle','🕯️'],['globo','balloon','🎈'],['Feliz cumpleaños','Happy birthday','🥳']]};function holidays(){show('<div class="card"><button class="btn purple" onclick="back()">← Home</button><h2>🎉 Holidays</h2><div class="grid"><button class="btn green" onclick="holiday(\'christmas\')">🎄 Christmas</button><button class="btn orange" onclick="holiday(\'thanksgiving\')">🦃 Thanksgiving</button><button class="btn gold" onclick="holiday(\'birthday\')">🎂 Birthday</button></div></div>')}function holiday(k){show(`<div class="card"><button class="btn purple" onclick="holidays()">← Holidays</button><h2>${k}</h2><div class="grid" id="hg"></div></div>`);HOL[k].forEach(x=>{let b=document.createElement('button');b.className='btn blue';b.innerHTML=x[2]+'<br>'+x[0]+'<div class="small">'+x[1]+'</div>';b.onclick=()=>es(x[0]);hg.appendChild(b)})}
const mama=[['Busca algo verde conmigo.','Find something green with Mama.','💚'],['Construye una torre de cinco bloques conmigo.','Build a five-block tower with Mama.','🧱'],['Di: Te quiero, mamá.','Say: I love you, Mama.','🥰'],['Cuenta diez pasos conmigo en español.','Count ten steps with Mama in Spanish.','👣'],['Dibuja una casa azul conmigo.','Draw a blue house with Mama.','🏠'],['Pregunta a mamá: ¿Quieres jugar?','Ask Mama: Do you want to play?','🎮'],['Elige una merienda y di su color en español.','Pick a snack and say its color in Spanish.','🍎']];function mamaTime(){let x=sh(mama)[0];show(`<div class="card gamepanel"><button class="btn purple" onclick="back()">← Home</button><h2>💚 Fun Time with Mama</h2><div class="emoji">${x[2]}</div><div class="word">${x[0]}</div><p class="center small">${x[1]}</p><button class="btn blue big" onclick="es('${x[0]}')">🔊 Hear it</button><div class="row"><button class="btn green" onclick="win(3);mamaTime()">We did it! ⭐⭐⭐</button><button class="btn gold" onclick="mamaTime()">New mission</button></div></div>`)}
const ca=[['Di a Bubba: Hola, ¿cómo estás?','Say to Bubba: Hi, how are you?','👋'],['Dale a Bubba un bloque rojo y di: rojo.','Give Bubba a red block and say red.','🧱'],['Construye una casa con Bubba.','Build a house with Bubba.','🏠'],['Pregunta: ¿Quieres jugar?','Ask: Do you want to play?','🎮'],['Cuenta cinco bloques con Bubba.','Count five blocks with Bubba.','5️⃣']];function canada(){let x=sh(ca)[0];show(`<div class="card"><button class="btn purple" onclick="back()">← Home</button><h2>🍁 Canada Adventure</h2><div class="emoji">${x[2]}</div><div class="word">${x[0]}</div><p class="center small">${x[1]}</p><button class="btn blue big" onclick="es('${x[0]}')">🔊 Hear it</button><button class="btn green big" onclick="win(2);canada()">Mission done! ⭐⭐</button></div>`)}
function videos(){let vv=[['🎨','Colors','https://www.youtube.com/results?search_query=Calico+Spanish+colors+for+kids'],['🔢','Numbers','https://www.youtube.com/results?search_query=Spanish+numbers+for+kids'],['🏃','Action verbs','https://www.youtube.com/results?search_query=Basho+and+Friends+Spanish+verbs+kids'],['🌦️','Weather','https://www.youtube.com/results?search_query=Spanish+weather+for+kids+beginner'],['🎄','Christmas Spanish','https://www.youtube.com/results?search_query=Spanish+Christmas+vocabulary+for+kids']];show('<div class="card"><button class="btn purple" onclick="back()">← Home</button><h2>▶️ Spanish Videos</h2><div class="note">Watch one short video, then come back and play a game on that topic.</div><div id="vl"></div></div>');vv.forEach(v=>{let d=document.createElement('div');d.className='video';d.innerHTML=`<div style="font-size:2rem">${v[0]}</div><div class="grow"><b>${v[1]}</b></div><button class="btn blue">Watch</button>`;d.querySelector('button').onclick=()=>window.open(v[2],'_blank');vl.appendChild(d)})}
function prizes(){show('<div class="card"><button class="btn purple" onclick="back()">← Home</button><h2>🎁 Prize Shop</h2><p>You have <b>⭐ '+S+'</b></p><div id="pl"></div></div>');prizesList.forEach((p,i)=>{let d=document.createElement('div');d.className='shop';d.innerHTML=`<b>${p.n}</b><span>⭐ ${p.c}</span>`;let b=document.createElement('button');b.className='btn green';b.textContent='Redeem';b.onclick=()=>{if(S<p.c)return alert('Keep learning!');if(confirm('Grown-up check: redeem this prize?')){S-=p.c;save();prizes()}};d.appendChild(b);pl.appendChild(d)})}
function openParentGate(){if(!pin){show('<div class="card"><button class="btn purple" onclick="back()">← Home</button><h2>🔒 Create Parent PIN</h2><p class="small">Choose a 4-digit PIN for Parent Mode.</p><input id="np" class="field" inputmode="numeric" maxlength="4" type="password" placeholder="4 digits"><button class="btn green big" onclick="setPin()">Save PIN</button></div>')}else{show('<div class="card"><button class="btn purple" onclick="back()">← Home</button><h2>🔒 Parent Mode</h2><p>Enter your 4-digit PIN.</p><input id="pp" class="field" inputmode="numeric" maxlength="4" type="password"><button class="btn green big" onclick="checkPin()">Unlock</button></div>')}}function setPin(){if(!/^\d{4}$/.test(np.value))return alert('Use exactly 4 numbers.');pin=np.value;localStorage.lrParentPin=pin;parent()}function checkPin(){if(pp.value===pin)parent();else alert('Wrong PIN')}function parent(){show(`<div class="card"><button class="btn purple" onclick="back()">← Home</button><h2>👩‍👦 Parent Mode</h2><div class="note">Progress is saved on this iPad. World flames, streaks and stars use local storage.</div><h3>Add a prize</h3><input id="pn" class="field" placeholder="Prize name"><input id="pc" class="field" type="number" placeholder="Star cost"><button class="btn green big" onclick="addPrize()">Add prize</button><h3>Security</h3><button class="btn blue" onclick="changePin()">Change Parent PIN</button><h3>World progress</h3><button class="btn red" onclick="if(confirm('Reset World 1 progress?')){world={unlocked:1,flames:{}};save();alert('World reset')}">Reset World 1</button></div>`)}function addPrize(){let n=pn.value.trim(),c=Number(pc.value);if(n&&c){prizesList.push({n,c});save();alert('Prize added')}}function changePin(){let n=prompt('Enter a new 4-digit PIN');if(/^\d{4}$/.test(n)){pin=n;localStorage.lrParentPin=pin;alert('PIN changed')}else if(n!==null)alert('PIN must be 4 digits')}
const WL=[
{title:'Color Meadow',kind:'pick',topic:'colors',goal:4},{title:'Number Bridge',kind:'pick',topic:'numbers',goal:4},{title:'Animal Grove',kind:'pick',topic:'animals',goal:4},{title:'Food Farm',kind:'pick',topic:'food',goal:4},{title:'Family House',kind:'pick',topic:'family',goal:4},{title:'Verb Valley',kind:'say',topic:'verbs',goal:4},{title:'Memory Mine',kind:'memory',topic:'colors',goal:4},{title:'Tic-Tac-Toe Tower',kind:'ttt',topic:'numbers',goal:3},{title:'Speed Cave',kind:'speed',topic:'animals',goal:5},{title:'Word Workshop',kind:'type',topic:'food',goal:3},{title:'Sentence River',kind:'sentence',goal:3},{title:'Simon Says Camp',kind:'simon',goal:4},{title:'Story Forest',kind:'story',goal:1},{title:'Speaking Castle',kind:'say',topic:'verbs',goal:5},{title:'World Boss',kind:'boss',goal:8}
];let activeLevel=1,correct=0,tries=0,goal=0,timer=null;
function openWorld(){renderWorld()}function renderWorld(){show(`<div class="card world-card"><button class="btn purple" onclick="back()">← Home</button><div class="worldhud"><div><h2 style="margin:0">🌍 World 1: Blocky Spanish Valley</h2><div class="small">Complete all 15 levels. Replay for 3 flames.</div></div><div><b>${Object.values(world.flames).reduce((a,b)=>a+b,0)} 🔥</b></div></div><div class="worldmap" id="wm"><div class="cloud c1">☁️</div><div class="cloud c2">☁️</div><div class="path"></div><div class="blockhill"></div><div class="avatar" id="ava">🧑‍🚀</div></div></div>`);WL.forEach((l,i)=>{let n=i+1,b=document.createElement('button'),side=i%2===0?28:62,top=70+i*49;b.className='levelnode '+(n<world.unlocked||world.flames[n]?'complete':n===world.unlocked?'open':'lock');b.style.left=`calc(${side}% - 41px)`;b.style.top=top+'px';let f=world.flames[n]||0;b.innerHTML=`${n}<div class="flames">${'🔥'.repeat(f)}</div>`;b.onclick=()=>{if(n<=world.unlocked||world.flames[n])startWorldLevel(n)};wm.appendChild(b)});let pos=Math.min(world.unlocked,15)-1,side=pos%2===0?28:62,top=70+pos*49;ava.style.left=`calc(${side}% + 42px)`;ava.style.top=(top+18)+'px'}
function startWorldLevel(n){activeLevel=n;correct=0;tries=0;goal=WL[n-1].goal;worldLevelScreen()}function worldLevelScreen(){let l=WL[activeLevel-1];show(`<div class="card gamepanel"><button class="btn purple" onclick="renderWorld()">← World Map</button><div class="small">WORLD 1 • LEVEL ${activeLevel}</div><h2>${l.title}</h2><div class="meter"><div id="prog" style="width:0%"></div></div><p class="center"><b><span id="score">0</span> / ${goal}</b></p><div id="game"></div></div>`);nextWorldChallenge()}
function nextWorldChallenge(){if(correct>=goal){finishWorldLevel();return}let l=WL[activeLevel-1];prog.style.width=(correct/goal*100)+'%';score.textContent=correct;if(l.kind==='pick'||l.kind==='speed'||l.kind==='boss')worldPick(l);else if(l.kind==='say')worldSay(l);else if(l.kind==='memory')worldMemory(l);else if(l.kind==='ttt')worldTTT(l);else if(l.kind==='type')worldType(l);else if(l.kind==='sentence')worldSentence(l);else if(l.kind==='simon')worldSimon(l);else if(l.kind==='story')worldStory(l)}
function worldPick(l){let pool=l.kind==='boss'?flat():V[l.topic],x=sh(pool)[0],opts=sh([x,...sh(flat().filter(y=>y[0]!=x[0])).slice(0,3)]);game.innerHTML=`<div class="emoji">${x[2]}</div><div class="word">Which one is <span style="color:#176ca0">${x[0]}</span>?</div><button class="btn blue big" onclick="es('${x[0]}')">🔊 Hear it</button><div class="answergrid" id="wa"></div>`;opts.forEach(y=>{let b=document.createElement('button');b.className='btn ans';b.innerHTML=`${y[2]}<br>${y[1]}`;b.onclick=()=>{tries++;if(y[0]===x[0]){correct++;S++;save();nextWorldChallenge()}else{b.classList.add('no');setTimeout(()=>b.classList.remove('no'),350)}};wa.appendChild(b)})}
function worldSay(l){let x=sh(V[l.topic])[0];game.innerHTML=`<div class="emoji">${x[2]}</div><div class="word">Say: ${x[0]}</div><p class="center small">${x[1]}</p><button class="btn blue big" onclick="es('${x[0]}')">🔊 Hear it</button><button class="btn green big" style="margin-top:10px" onclick="tries++;correct++;S++;save();nextWorldChallenge()">I said it! 🎤</button>`;es(x[0])}
function worldMemory(){let a=sh(V.colors).slice(0,4),cards=[];a.forEach((x,i)=>{cards.push({id:i,t:x[0]},{id:i,t:x[2]})});cards=sh(cards);game.innerHTML='<p class="center"><b>Match the Spanish word to its picture.</b></p><div class="answergrid" id="mem"></div>';let first=null,lock=false,m=0;cards.forEach(c=>{let b=document.createElement('button');b.className='btn ans';b.textContent='?';b.onclick=()=>{if(lock||b.dataset.done)return;b.textContent=c.t;if(!first){first={b,c}}else{tries++;lock=true;if(first.c.id===c.id){first.b.dataset.done=b.dataset.done='1';first.b.classList.add('ok');b.classList.add('ok');m++;correct=Math.min(goal,m);setTimeout(()=>{first=null;lock=false;nextWorldChallenge()},450)}else{setTimeout(()=>{first.b.textContent='?';b.textContent='?';first=null;lock=false},500)}}};mem.appendChild(b)})}
function worldTTT(){game.innerHTML='<p class="center"><b>Answer correctly to place your X.</b></p><div class="ttt" id="tt"></div>';for(let i=0;i<9;i++){let b=document.createElement('button');b.className='cell';b.onclick=()=>ttQuestion(b);tt.appendChild(b)}}function ttQuestion(cell){if(cell.textContent)return;let x=sh(V.numbers)[0];let ans=prompt('What does “'+x[0]+'” mean?');tries++;if(ans&&ans.trim().toLowerCase()===x[1]){cell.textContent='X';correct++;S++;save();if(correct>=goal)finishWorldLevel()}else alert('Try again! '+x[0]+' means '+x[1]+'.')}
function worldType(l){let x=sh(V[l.topic].filter(v=>v[0].length<8))[0],target=strip(x[0]);game.innerHTML=`<div class="emoji">${x[2]}</div><p class="center">Type the Spanish word for <b>${x[1]}</b>.</p><p class="center small">Hint: ${x[0]}</p><input id="wi" class="field" autocomplete="off"><button class="btn green big" onclick="tries++;if(strip(wi.value.toLowerCase())==='${target}'){correct++;S++;save();nextWorldChallenge()}else alert('Try again')">Check</button>`}
function worldSentence(){let q=sh(sents)[0];game.innerHTML=`<p class="center"><b>${q.en}</b></p><div class="bank" id="sb"></div><div class="drop" id="sd"></div><button class="btn green big" onclick="tries++;if(sd.dataset.words===JSON.stringify(${JSON.stringify(['placeholder'])})){ }">Check</button>`;let chosen=[];let check=game.querySelector('.btn.green');check.onclick=()=>{tries++;if(JSON.stringify(chosen)===JSON.stringify(q.es)){correct++;S++;save();nextWorldChallenge()}else alert('Try the order again')};sh(q.es).forEach(w=>{let b=document.createElement('button');b.className='chip';b.textContent=w;b.onclick=()=>{chosen.push(w);let z=document.createElement('span');z.className='chip';z.textContent=w;sd.appendChild(z);b.disabled=true;es(w)};sb.appendChild(b)})}
function worldSimon(){let a=[['salta tres veces','jump three times'],['toca tu cabeza','touch your head'],['levanta una mano','raise one hand'],['corre a la puerta','run to the door']],x=sh(a)[0];game.innerHTML=`<div class="emoji">🕺</div><div class="word">Simón dice: ${x[0]}.</div><p class="center small">${x[1]}</p><button class="btn blue big" onclick="es('Simón dice: ${x[0]}')">🔊 Hear it</button><button class="btn green big" style="margin-top:10px" onclick="tries++;correct++;S++;save();nextWorldChallenge()">Done!</button>`}
