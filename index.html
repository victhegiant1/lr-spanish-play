</head><body><div class="app">

<script>
const vocab={colors:[['rojo','red','🔴'],['azul','blue','🔵'],['verde','green','🟢'],['amarillo','yellow','🟡'],['morado','purple','🟣']],numbers:[['uno','one','1️⃣'],['dos','two','2️⃣'],['tres','three','3️⃣'],['cuatro','four','4️⃣'],['cinco','five','5️⃣'],['seis','six','6️⃣'],['siete','seven','7️⃣'],['ocho','eight','8️⃣'],['nueve','nine','9️⃣'],['diez','ten','🔟']],verbs:[['corre','run','🏃'],['salta','jump','🤸'],['come','eat','🍎'],['bebe','drink','🥤'],['mira','look','👀'],['duerme','sleep','😴'],['lee','read','📚'],['juega','play','🧸'],['abre','open','📖'],['cierra','close','🚪']],food:[['manzana','apple','🍎'],['pan','bread','🍞'],['leche','milk','🥛'],['pollo','chicken','🍗'],['arroz','rice','🍚'],['queso','cheese','🧀'],['agua','water','💧'],['fresa','strawberry','🍓']],weather:[['hace sol','sunny','☀️'],['llueve','raining','🌧️'],['nieva','snowing','❄️'],['hace frío','cold','🥶'],['hace calor','hot','🥵']],family:[['mamá','mom','👩'],['papá','dad','👨'],['abuela','grandma','👵'],['abuelo','grandpa','👴'],['familia','family','👨‍👩‍👦']],body:[['cabeza','head','🙂'],['mano','hand','✋'],['pie','foot','🦶'],['ojos','eyes','👀'],['nariz','nose','👃'],['boca','mouth','👄']],animals:[['perro','dog','🐶'],['gato','cat','🐱'],['pájaro','bird','🐦'],['pez','fish','🐟'],['caballo','horse','🐴'],['oso','bear','🐻']],calendar:[['lunes','Monday','📅'],['martes','Tuesday','📅'],['miércoles','Wednesday','📅'],['jueves','Thursday','📅'],['viernes','Friday','📅'],['sábado','Saturday','📅'],['domingo','Sunday','📅'],['enero','January','❄️'],['febrero','February','💙'],['marzo','March','🌱'],['abril','April','🌷'],['mayo','May','🌼'],['junio','June','☀️'],['julio','July','🏖️'],['agosto','August','🌞'],['septiembre','September','🍎'],['octubre','October','🎃'],['noviembre','November','🦃'],['diciembre','December','🎄'],['año','year','🗓️'],['mes','month','🗓️'],['día','day','☀️']]};
let S=Number(localStorage.lrStars||0),recUrl=null,recorder=null,chunks=[],sayTarget=null;let prizeList=JSON.parse(localStorage.lrPrizes||'null')||[{n:'Pick bedtime story',c:8},{n:'Choose family game',c:10},{n:'Pick dessert',c:12},{n:'10 bonus screen minutes',c:15},{n:'Choose movie night',c:20},{n:'Small prize-bin surprise',c:25}];
const H=document.getElementById('home'),X=document.getElementById('screen');
function save(){localStorage.lrStars=S;localStorage.lrPrizes=JSON.stringify(prizeList);stars.textContent=S;level.textContent='Level '+Math.min(10,1+Math.floor(S/25))}function show(html){markToday();H.classList.add('hidden');X.classList.remove('hidden');X.innerHTML=html}function back(){X.classList.add('hidden');H.classList.remove('hidden');renderToday();save()}function es(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-MX';u.rate=.76;speechSynthesis.speak(u)}function en(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}function flat(){return Object.values(vocab).flat()}function sh(a){return [...a].sort(()=>Math.random()-.5)}function strip(t){return t.normalize('NFD').replace(/[\u0300-\u036f]/g,'')}function win(n=1){S+=n;save();alert('⭐ Great job! +'+n+' star'+(n>1?'s':''))}
function dateKey(d=new Date()){return d.toISOString().slice(0,10)}function markToday(){let a=JSON.parse(localStorage.lrDays||'[]');let k=dateKey();if(!a.includes(k)){a.push(k);localStorage.lrDays=JSON.stringify(a)}}function daysDone(){return JSON.parse(localStorage.lrDays||'[]')}function streakCount(){let set=new Set(daysDone()),n=0,d=new Date();while(set.has(dateKey(d))){n++;d.setDate(d.getDate()-1)}return n}
function spanishDate(d=new Date()){let days=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'],months=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];return `Hoy es ${days[d.getDay()]}, ${d.getDate()} de ${months[d.getMonth()]} de ${d.getFullYear()}.`}function renderToday(){todayText.textContent=spanishDate()}function hearToday(){es(spanishDate())}
function topics(){show('<div class="card"><button class="btn purple" onclick="back()">← Home</button><h2>Choose a topic</h2><div class="grid" id="tg"></div></div>');let names={colors:'🎨 Colors',numbers:'🔢 Numbers',verbs:'🏃 Verbs',food:'🍎 Food',weather:'🌦️ Weather',family:'👨‍👩‍👦 Family',body:'🖐️ Body',animals:'🐶 Animals',calendar:'📅 Calendar'};Object.keys(vocab).forEach(k=>{let b=document.createElement('button');b.className='btn blue';b.textContent=names[k];b.onclick=()=>lesson(k,0);tg.appendChild(b)})}
function lesson(k,i){let x=vocab[k][i];show(`<div class="card"><button class="btn purple" onclick="topics()">← Topics</button><div class="emoji">${x[2]}</div><div class="word">${x[0]}</div><p class="center small">${x[1]}</p><button class="btn blue big" onclick="es('${x[0].replace(/'/g,"\\'")}')">🔊 Hear it</button><p class="center">Say it out loud.</p><button class="btn green big" id="next">I said it! ⭐</button></div>`);next.onclick=()=>{S++;save();i+1<vocab[k].length?lesson(k,i+1):topics()}}
function practice(){let x=sh(flat())[0],pool=sh([x,...sh(flat().filter(y=>y[0]!=x[0])).slice(0,3)]);show(`<div class="card"><button class="btn purple" onclick="back()">← Home</button><h2 class="center">Which one means “${x[0]}”?</h2><p class="center small">${x[1]}</p><div class="answergrid" id="ag"></div><button class="btn blue big" onclick="es('${x[0].replace(/'/g,"\\'")}')">🔊 Repeat</button></div>`);pool.forEach(y=>{let b=document.createElement('button');b.className='btn ans';b.innerHTML=`<span style="font-size:2rem">${y[2]}</span><br>${y[1]}`;b.onclick=()=>{if(y[0]==x[0]){b.classList.add('ok');win();setTimeout(practice,450)}else{b.classList.add('no');setTimeout(()=>b.classList.remove('no'),450)}};ag.appendChild(b)})}
let typeObj,typeVal='';function typing(){typeObj=sh(flat().filter(x=>x[0].length<9&&!x[0].includes(' ')))[0];typeVal='';let target=strip(typeObj[0]),letters=sh([...new Set((target+'aeioubcdfglnmprstv').split(''))]).slice(0,14);target.split('').forEach(l=>{if(!letters.includes(l))letters.push(l)});show(`<div class="card"><button class="btn purple" onclick="back()">← Home</button><div class="emoji">${typeObj[2]}</div><h2 class="center">Build the Spanish word</h2><p class="center small">${typeObj[1]} • Copy: ${typeObj[0]}</p><div class="word" id="tb">${'_ '.repeat(target.length)}</div><div class="bank" id="kb"></div><div class="row"><button class="btn red" onclick="typeVal=typeVal.slice(0,-1);tb.textContent=typeVal||'${'_ '.repeat(target.length)}'">⌫</button><button class="btn green" onclick="if(typeVal=='${target}'){win(2);typing()}else alert('Try again 🙂')">Check ⭐</button><button class="btn blue" onclick="es('${typeObj[0].replace(/'/g,"\\'")}')">🔊</button></div></div>`);sh(letters).forEach(l=>{let b=document.createElement('button');b.className='chip';b.textContent=l;b.onclick=()=>{typeVal+=l;tb.textContent=typeVal};kb.appendChild(b)})}
const sp={who:[['El niño','👦'],['La niña','👧'],['El perro','🐶'],['El gato','🐱']],verb:[['come','🍎'],['mira','👀'],['lleva','🎒'],['encuentra','🔎']],thing:[['una manzana','🍎'],['un libro','📘'],['una pelota','⚽'],['un juguete','🧸']],where:[['en la casa','🏠'],['en el parque','🌳'],['en la escuela','🏫'],['en Canadá','🍁']]};let picked={};function story(){picked={};show('<div class="card"><button class="btn purple" onclick="back()">← Home</button><h2>📖 Build a Picture Story</h2><div id="sa"></div><div id="so" class="word">Pick your pictures!</div><div class="row"><button class="btn blue" onclick="if(so.textContent!=\'Pick your pictures!\')es(so.textContent)">🔊 Read it</button><button class="btn green" onclick="if(Object.keys(picked).length==4)win(3)">I said it! ⭐</button></div></div>');Object.entries(sp).forEach(([k,a])=>{let h=document.createElement('h3');h.textContent=k;sa.appendChild(h);let g=document.createElement('div');g.className='grid';a.forEach(x=>{let b=document.createElement('button');b.className='btn blue';b.innerHTML=x[1]+'<br>'+x[0];b.onclick=()=>{picked[k]=x[0];so.textContent=[picked.who,picked.verb,picked.thing,picked.where].filter(Boolean).join(' ')};g.appendChild(b)});sa.appendChild(g)})}
const sentences=[{en:'The boy eats an apple.',es:['El niño','come','una manzana']},{en:'The dog drinks water.',es:['El perro','bebe','agua']},{en:'The girl reads a book.',es:['La niña','lee','un libro']},{en:'Mom eats rice.',es:['Mamá','come','arroz']},{en:'The boy plays in the house.',es:['El niño','juega','en la casa']}];let cur,built=[];function sentence(){cur=sh(sentences)[0];built=[];show(`<div class="card"><button class="btn purple" onclick="back()">← Home</button><h2>🧩 Build the Spanish Sentence</h2><div class="note">Hear the English sentence. Tap Spanish cards to hear them and build the sentence.</div><h2 class="center">${cur.en}</h2><button class="btn blue big" onclick="en('${cur.en.replace(/'/g,"\\'")}')">🔊 Hear English</button><div class="bank" id="bank"></div><div class="drop" id="drop"></div><div class="row"><button class="btn red" onclick="sentence()">Clear</button><button class="btn green" onclick="if(JSON.stringify(built)==JSON.stringify(cur.es)){win(3);sentence()}else alert('Try the order again')">Check ⭐</button><button class="btn blue" onclick="es(built.join(' '))">🔊 Hear mine</button></div></div>`);let distract=sh(flat().map(x=>x[0]).filter(w=>!cur.es.includes(w))).slice(0,2);sh([...cur.es,...distract]).forEach((w,i)=>{let b=document.createElement('button');b.className='chip';b.textContent=w;b.onclick=()=>{es(w);if(!b.classList.contains('used')){b.classList.add('used');built.push(w);let c=document.createElement('button');c.className='chip';c.textContent=w;c.onclick=()=>{let j=built.indexOf(w);if(j>-1)built.splice(j,1);b.classList.remove('used');c.remove()};drop.appendChild(c)}};bank.appendChild(b)})}
function sayit(){sayTarget=sh(flat())[0];show(`<div class="card"><button class="btn purple" onclick="back()">← Home</button><h2>🎤 Say It!</h2><div class="emoji">${sayTarget[2]}</div><div class="word">${sayTarget[0]}</div><p class="center small">${sayTarget[1]}</p><button class="btn blue big" onclick="es('${sayTarget[0].replace(/'/g,"\\'")}')">🔊 Hear Spanish</button><div class="card" style="box-shadow:none;background:#f5f8fa"><div id="rs" class="center small">Record yourself, then hear it back.</div><div class="row"><button class="btn red" onclick="startRec()">⏺ Record</button><button class="btn purple" onclick="stopRec()">⏹ Stop</button><button class="btn green" onclick="playRec()">▶️ Hear Me</button></div><button class="btn gold big" style="margin-top:10px" onclick="speechCheck()">✨ Check my pronunciation</button><div id="rate" class="center" style="margin-top:10px"></div></div><button class="btn green big" onclick="S++;save();sayit()">Next word ⭐</button></div>`)}async function startRec(){try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{let blob=new Blob(chunks,{type:chunks[0]?.type||'audio/webm'});recUrl=URL.createObjectURL(blob);stream.getTracks().forEach(t=>t.stop());rs.textContent='Recorded! Tap Hear Me.'};recorder.start();rs.textContent='Listening…'}catch(e){rs.textContent='Allow microphone access in Safari.'}}function stopRec(){if(recorder&&recorder.state!='inactive')recorder.stop()}function playRec(){if(recUrl)new Audio(recUrl).play()}function speechCheck(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){rate.textContent='👂 Auto-check is not supported here. Listen back with Mama!';return}let r=new SR();r.lang='es-MX';r.maxAlternatives=3;r.onresult=e=>{let heard=[...e.results[0]].map(x=>strip(x.transcript.toLowerCase().trim())),tar=strip(sayTarget[0].toLowerCase());let good=heard.some(h=>h==tar||h.includes(tar)||tar.includes(h));if(good){rate.textContent='🌟 Great pronunciation! Bonus star!';S++;save()}else rate.textContent='💪 Almost! Hear it and try again.'};r.onerror=()=>rate.textContent='Try again or listen back with Mama.';r.start()}
const physical=[['Encuentra algo azul.','Find something blue.','🔵'],['Encuentra algo verde.','Find something green.','🟢'],['Simón dice: salta tres veces.','Simon says: jump three times.','🤸'],['Haz una torre con cinco bloques.','Make a tower with five blocks.','🧱']];function games(){let x=sh(physical)[0];show(`<div class="card"><button class="btn purple" onclick="back()">← Home</button><h2>🎮 Spanish Mission</h2><div class="emoji">${x[2]}</div><div class="word">${x[0]}</div><p class="center small">${x[1]}</p><button class="btn blue big" onclick="es('${x[0].replace(/'/g,"\\'")}')">🔊 Hear it</button><button class="btn green big" style="margin-top:10px" onclick="win(2);games()">Done! ⭐⭐</button></div>`)}
const holiday={christmas:[['Navidad','Christmas','🎄'],['regalo','gift','🎁'],['árbol','tree','🌲'],['luces','lights','✨'],['Feliz Navidad','Merry Christmas','🎅']],thanksgiving:[['pavo','turkey','🦃'],['gracias','thank you','🙏'],['comida','food','🍽️'],['familia','family','👨‍👩‍👦']],birthday:[['cumpleaños','birthday','🎂'],['pastel','cake','🍰'],['vela','candle','🕯️'],['globo','balloon','🎈'],['Feliz cumpleaños','Happy birthday','🥳']]};function holidays(){show(`<div class="card"><button class="btn purple" onclick="back()">← Home</button><h2>🎉 Holidays</h2><div class="grid"><button class="btn green" onclick="holidayPart('christmas')">🎄 Christmas</button><button class="btn orange" onclick="holidayPart('thanksgiving')">🦃 Thanksgiving</button><button class="btn gold" onclick="holidayPart('birthday')">🎂 Birthday</button></div></div>`)}function holidayPart(k){show(`<div class="card"><button class="btn purple" onclick="holidays()">← Holidays</button><h2>${k[0].toUpperCase()+k.slice(1)}</h2><div class="grid" id="hg"></div></div>`);holiday[k].forEach(x=>{let b=document.createElement('button');b.className='btn blue';b.innerHTML=`${x[2]}<br>${x[0]}<div class="small">${x[1]}</div>`;b.onclick=()=>es(x[0]);hg.appendChild(b)})}
const canadaM=[['Di a Bubba: Hola, ¿cómo estás?','Say to Bubba: Hi, how are you?','👋'],['Dale a Bubba un bloque verde y di: verde.','Give Bubba a green block and say green.','🟩'],['Construye una casa con Bubba.','Build a house with Bubba.','🏠'],['Pregunta: ¿Quieres jugar?','Ask: Do you want to play?','🎮'],['Cuenta cinco bloques con Bubba en español.','Count five blocks with Bubba in Spanish.','5️⃣']];function canada(){let x=sh(canadaM)[0];show(`<div class="card"><button class="btn purple" onclick="back()">← Home</button><h2>🍁 Canada Adventure with Bubba</h2><div class="emoji">${x[2]}</div><div class="word">${x[0]}</div><p class="center small">${x[1]}</p><button class="btn blue big" onclick="es('${x[0].replace(/'/g,"\\'")}')">🔊 Hear it</button><button class="btn green big" style="margin-top:10px" onclick="win(2);canada()">Mission done! ⭐⭐</button></div>`)}
const mamaM=[['Di a Mama: Te quiero.','Tell Mama: I love you.','💚'],['Busca tres cosas azules con Mama.','Find three blue things with Mama.','🔵'],['Construye una torre con Mama y cuenta en español.','Build a tower with Mama and count in Spanish.','🧱'],['Juega a Simón Dice con Mama.','Play Simon Says with Mama.','🕺'],['Dibuja una casa con Mama y nombra tres colores.','Draw a house with Mama and name three colors.','🏠'],['Haz una merienda y nombra la comida en español.','Make a snack and name the food in Spanish.','🍎']];function mamaTime(){let x=sh(mamaM)[0];show(`<div class="card"><button class="btn purple" onclick="back()">← Home</button><h2>💚 Fun Time with Mama</h2><p class="small">Do it together and talk in Spanish.</p><div class="emoji">${x[2]}</div><div class="word">${x[0]}</div><p class="center small">${x[1]}</p><button class="btn blue big" onclick="es('${x[0].replace(/'/g,"\\'")}')">🔊 Hear it</button><button class="btn green big" style="margin-top:10px" onclick="win(2);mamaTime()">We did it! ⭐⭐</button></div>`)}
function calendarPractice(){lesson('calendar',0)}function calendarView(){let d=new Date(),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate(),done=new Set(daysDone()),names=['D','L','M','X','J','V','S'];show(`<div class="card"><button class="btn purple" onclick="back()">← Home</button><h2>🔥 Spanish Streak</h2><div class="streak">${streakCount()} day streak</div><p class="center small">Every day LR opens and uses the app gets marked.</p><h3 class="center">${new Intl.DateTimeFormat('es-ES',{month:'long',year:'numeric'}).format(d)}</h3><div class="calendar" id="cal"></div><div class="row" style="margin-top:12px"><button class="btn blue" onclick="hearToday()">🔊 Hear today's date</button><button class="btn green" onclick="calendarPractice()">📅 Learn days & months</button></div></div>`);names.forEach(n=>{let e=document.createElement('div');e.className='dow';e.textContent=n;cal.appendChild(e)});for(let i=0;i<first;i++){let e=document.createElement('div');cal.appendChild(e)}for(let n=1;n<=last;n++){let dt=new Date(y,m,n),k=dateKey(dt),e=document.createElement('div');e.className='day'+(done.has(k)?' done':'')+(k==dateKey()?' today':'');e.textContent=n;cal.appendChild(e)}}
function videos(){let v=[['🎨 Colors','https://www.youtube.com/results?search_query=Calico+Spanish+colors+for+kids'],['🔢 Numbers','https://www.youtube.com/results?search_query=Super+Simple+Espa%C3%B1ol+numbers+1+10'],['🏃 Verbs','https://www.youtube.com/results?search_query=Basho+and+Friends+Spanish+verbs+kids'],['📅 Days & Months','https://www.youtube.com/results?search_query=Spanish+days+months+for+kids'],['🎄 Christmas','https://www.youtube.com/results?search_query=Spanish+Christmas+vocabulary+for+kids']];show('<div class="card"><button class="btn purple" onclick="back()">← Home</button><h2>▶️ Spanish Video Time</h2><div id="vl"></div></div>');v.forEach(x=>{let d=document.createElement('div');d.className='video';d.innerHTML=`<div style="font-size:2rem">${x[0].split(' ')[0]}</div><div class="grow"><b>${x[0]}</b><div class="small">Beginner kid practice</div></div>`;let b=document.createElement('button');b.className='btn blue';b.textContent='Watch';b.onclick=()=>window.open(x[1],'_blank');d.appendChild(b);vl.appendChild(d)})}
function prizes(){show(`<div class="card"><button class="btn purple" onclick="back()">← Home</button><h2>🎁 Prize Shop</h2><p>You have <b>⭐ ${S}</b></p><div id="pl"></div></div>`);prizeList.forEach((p,i)=>{let d=document.createElement('div');d.className='shop';d.innerHTML=`<b>${p.n}</b><span>⭐ ${p.c}</span>`;let b=document.createElement('button');b.className='btn green';b.textContent='Redeem';b.onclick=()=>{if(S<p.c)return alert('Keep learning!');if(confirm('Ask Mama: redeem this prize?')){S-=p.c;save();prizes()}};d.appendChild(b);pl.appendChild(d)})}
function parentAccess(){let pin=localStorage.lrParentPin;if(!pin){let a=prompt('Mama: create a 4-digit Parent PIN');if(!a)return;if(!/^\d{4}$/.test(a))return alert('Please use exactly 4 numbers.');localStorage.lrParentPin=a;alert('Parent PIN saved.');parent()}else{let a=prompt('Enter Parent PIN');if(a===pin)parent();else if(a!==null)alert('Wrong PIN.')}}function parent(){show(`<div class="card"><button class="btn purple" onclick="back()">← Home</button><h2>🔒 Parent Mode</h2><div class="note">Keep sessions around 5–10 minutes. Prioritize speaking over perfect accuracy.</div><h3>Add prize</h3><input class="field" id="pn" placeholder="Prize name"><input class="field" id="pc" type="number" min="1" placeholder="Star cost"><button class="btn green big" onclick="let n=pn.value.trim(),c=Number(pc.value);if(n&&c){prizeList.push({n:n,c:c});save();parent()}">Add prize</button><div id="pp"></div><h3>Parent PIN</h3><button class="btn blue" onclick="changePin()">Change PIN</button><h3>Progress</h3><button class="btn red" onclick="if(confirm('Reset all stars?')){S=0;save();parent()}">Reset stars</button></div>`);prizeList.forEach((p,i)=>{let d=document.createElement('div');d.className='shop';d.innerHTML=`${p.n} — ⭐ ${p.c}`;let b=document.createElement('button');b.className='btn red';b.textContent='Delete';b.onclick=()=>{prizeList.splice(i,1);save();parent()};d.appendChild(b);pp.appendChild(d)})}function changePin(){let a=prompt('Enter a new 4-digit PIN');if(/^\d{4}$/.test(a||'')){localStorage.lrParentPin=a;alert('PIN updated.')}else if(a!==null)alert('Use exactly 4 numbers.')}
function daily(){let k=sh(Object.keys(vocab))[0];lesson(k,0)}
markToday();renderToday();save();
</script></body></html>
