<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#3558d4">
<title>LR Spanish Play</title><link rel="manifest" href="manifest.json">
<style>
:root{--b:#3558d4;--p:#7657d5;--g:#14966a;--y:#f4b400;--r:#d94c55;--ink:#202633;--muted:#707887;--card:#fff}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:linear-gradient(#edf4ff,#fff9ef)}button,input{font:inherit}.app{max-width:820px;margin:auto;min-height:100vh;padding:16px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900}.stars{background:#fff;padding:9px 13px;border-radius:999px;box-shadow:0 8px 20px #0001;font-weight:900}.card{background:#fff;border-radius:24px;padding:20px;margin:14px 0;box-shadow:0 10px 26px #00000016}.hero h1{margin:.2rem 0}.small{color:var(--muted);font-size:.9rem}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.btn{border:0;border-radius:18px;padding:15px;font-weight:850;box-shadow:0 4px 12px #0001}.blue{background:#e9efff;color:#2442a2}.green{background:#e8fbf3;color:#0f7653}.purple{background:#f1ebff;color:#6548aa}.gold{background:#fff3ce;color:#8c6100}.red{background:#ffecee;color:#9f3036}.pink{background:#ffedf6;color:#9d2c68}.orange{background:#fff0df;color:#9d5817}.hidden{display:none!important}.big{width:100%;font-size:1.08rem}.emoji{text-align:center;font-size:4.5rem}.word{text-align:center;font-size:2.1rem;font-weight:950}.center{text-align:center}.row{display:flex;gap:8px;flex-wrap:wrap}.row>.btn{flex:1}.answergrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.ans{border:3px solid transparent;background:#f7f8fb;min-height:80px}.ok{border-color:#2bab69;background:#ebfff3}.no{border-color:#e85b64;background:#fff0f1}.bank,.drop{display:flex;gap:8px;flex-wrap:wrap;min-height:70px;padding:12px;border-radius:16px;background:#f7f8fb;margin:10px 0}.drop{border:3px dashed #cfd7ea}.chip{background:#fff;border:2px solid #dde3ef;border-radius:14px;padding:11px;font-weight:850}.chip.used{opacity:.35}.note{padding:12px;background:#fff8df;border-radius:14px;color:#6d5400}.shop{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#f7f8fb;padding:12px;border-radius:15px;margin:8px 0}.field{width:100%;padding:12px;border:2px solid #dce2ef;border-radius:12px;margin:6px 0}.video{display:flex;align-items:center;gap:10px;background:#f7f8fb;padding:12px;border-radius:15px;margin:8px 0}.video .grow{flex:1}.level{margin-top:10px;font-weight:800}.recordbox{background:#f7f8fb;padding:14px;border-radius:16px}.footer{text-align:center;color:#8b919c;font-size:.8rem;padding:8px}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head><body><div class="app">
<div class="top"><div class="brand">🌟 LR Spanish Play</div><div class="stars">⭐ <span id="stars">0</span></div></div>
<section id="home"><div class="card hero"><div class="small">Lawson-Rae • age 6</div><h1>¡Hola, LR!</h1><p>Learn a little. Talk a lot. Play.</p><div class="level" id="level">Level 1</div></div><div class="card"><b>🌞 Today's Spanish Adventure</b><p class="small">Learn → speak → play.</p><button class="btn blue big" onclick="daily()">Start today's lesson</button></div><div class="grid">
<button class="btn blue" onclick="topics()">📚<br>Learn</button><button class="btn green" onclick="practice()">🎯<br>Practice</button><button class="btn purple" onclick="typing()">⌨️<br>Type</button><button class="btn pink" onclick="story()">📖<br>Story</button><button class="btn orange" onclick="sentence()">🧩<br>Sentence</button><button class="btn green" onclick="sayit()">🎤<br>Say It</button><button class="btn gold" onclick="games()">🎮<br>Games</button><button class="btn pink" onclick="holidays()">🎉<br>Holidays</button><button class="btn purple" onclick="canada()">🍁<br>Canada</button><button class="btn blue" onclick="videos()">▶️<br>Videos</button><button class="btn green" onclick="prizes()">🎁<br>Prizes</button><button class="btn purple" onclick="parent()">👩‍👦<br>Parent</button></div></section>
<section id="screen" class="hidden"></section><div class="footer">Safari → Share → Add to Home Screen</div></div>
<script>
const vocab={colors:[['rojo','red','🔴'],['azul','blue','🔵'],['verde','green','🟢'],['amarillo','yellow','🟡'],['morado','purple','🟣']],numbers:[['uno','one','1️⃣'],['dos','two','2️⃣'],['tres','three','3️⃣'],['cuatro','four','4️⃣'],['cinco','five','5️⃣'],['seis','six','6️⃣'],['siete','seven','7️⃣'],['ocho','eight','8️⃣'],['nueve','nine','9️⃣'],['diez','ten','🔟']],verbs:[['corre','run','🏃'],['salta','jump','🤸'],['come','eat','🍎'],['bebe','drink','🥤'],['mira','look','👀'],['duerme','sleep','😴'],['lee','read','📚'],['juega','play','🧸'],['abre','open','📖'],['cierra','close','🚪']],food:[['manzana','apple','🍎'],['pan','bread','🍞'],['leche','milk','🥛'],['pollo','chicken','🍗'],['arroz','rice','🍚'],['queso','cheese','🧀'],['agua','water','💧'],['fresa','strawberry','🍓']],weather:[['hace sol','sunny','☀️'],['llueve','raining','🌧️'],['nieva','snowing','❄️'],['hace frío','cold','🥶'],['hace calor','hot','🥵']],family:[['mamá','mom','👩'],['papá','dad','👨'],['abuela','grandma','👵'],['abuelo','grandpa','👴'],['familia','family','👨‍👩‍👦']],body:[['cabeza','head','🙂'],['mano','hand','✋'],['pie','foot','🦶'],['ojos','eyes','👀'],['nariz','nose','👃'],['boca','mouth','👄']],animals:[['perro','dog','🐶'],['gato','cat','🐱'],['pájaro','bird','🐦'],['pez','fish','🐟'],['caballo','horse','🐴'],['oso','bear','🐻']]};
let S=Number(localStorage.lrStars||0),recUrl=null,recorder=null,chunks=[],sayTarget=null;let prizeList=JSON.parse(localStorage.lrPrizes||'null')||[{n:'Pick bedtime story',c:8},{n:'Choose family game',c:10},{n:'Pick dessert',c:12},{n:'10 bonus screen minutes',c:15},{n:'Choose movie night',c:20},{n:'Small prize-bin surprise',c:25}];
const H=document.getElementById('home'),X=document.getElementById('screen');function save(){localStorage.lrStars=S;localStorage.lrPrizes=JSON.stringify(prizeList);stars.textContent=S;level.textContent='Level '+Math.min(5,1+Math.floor(S/25))}save();function show(html){H.classList.add('hidden');X.classList.remove('hidden');X.innerHTML=html}function back(){X.classList.add('hidden');H.classList.remove('hidden');save()}function es(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-MX';u.rate=.78;speechSynthesis.speak(u)}function en(t){let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}function flat(){return Object.values(vocab).flat()}function sh(a){return [...a].sort(()=>Math.random()-.5)}function strip(t){return t.normalize('NFD').replace(/[\u0300-\u036f]/g,'')}function win(n=1){S+=n;save();alert('⭐ Great job! +'+n+' star'+(n>1?'s':''))}
function topics(){show('<div class="card"><button class="btn purple" onclick="back()">← Home</button><h2>Choose a topic</h2><div class="grid" id="tg"></div></div>');Object.keys(vocab).forEach(k=>{let b=document.createElement('button');b.className='btn blue';b.textContent=({colors:'🎨 Colors',numbers:'🔢 Numbers',verbs:'🏃 Verbs',food:'🍎 Food',weather:'🌦️ Weather',family:'👨‍👩‍👦 Family',body:'🖐️ Body',animals:'🐶 Animals'})[k];b.onclick=()=>lesson(k,0);tg.appendChild(b)})}
function lesson(k,i){let x=vocab[k][i];show(`<div class="card"><button class="btn purple" onclick="topics()">← Topics</button><div class="emoji">${x[2]}</div><div class="word">${x[0]}</div><p class="center small">${x[1]}</p><button class="btn blue big" onclick="es('${x[0]}')">🔊 Hear it</button><p class="center">Say it out loud.</p><button class="btn green big" id="next">I said it! ⭐</button></div>`);next.onclick=()=>{S++;save();i+1<vocab[k].length?lesson(k,i+1):topics()}}
function practice(){let x=sh(flat())[0],pool=sh([x,...sh(flat().filter(y=>y[0]!=x[0])).slice(0,3)]);show(`<div class="card"><button class="btn purple" onclick="back()">← Home</button><h2 class="center">Which one means “${x[0]}”?</h2><p class="center small">${x[1]}</p><div class="answergrid" id="ag"></div><button class="btn blue big" onclick="es('${x[0]}')">🔊 Repeat</button></div>`);pool.forEach(y=>{let b=document.createElement('button');b.className='btn ans';b.innerHTML=`<span style="font-size:2rem">${y[2]}</span><br>${y[1]}`;b.onclick=()=>{if(y[0]==x[0]){b.classList.add('ok');win();setTimeout(practice,500)}else{b.classList.add('no');setTimeout(()=>b.classList.remove('no'),500)}};ag.appendChild(b)})}
let typeObj,typeVal='';function typing(){typeObj=sh(flat().filter(x=>x[0].length<9&&!x[0].includes(' ')))[0];typeVal='';let target=strip(typeObj[0]),letters=sh([...new Set((target+'aeioubcdfglnmprstv').split(''))]).slice(0,14);target.split('').forEach(l=>{if(!letters.includes(l))letters.push(l)});show(`<div class="card"><button class="btn purple" onclick="back()">← Home</button><div class="emoji">${typeObj[2]}</div><h2 class="center">Build the Spanish word</h2><p class="center small">${typeObj[1]} • Copy: ${typeObj[0]}</p><div class="word" id="tb">${'_ '.repeat(target.length)}</div><div class="bank" id="kb"></div><div class="row"><button class="btn red" onclick="typeVal=typeVal.slice(0,-1);tb.textContent=typeVal">⌫</button><button class="btn green" onclick="if(typeVal=='${target}'){win(2);typing()}else alert('Try again 🙂')">Check ⭐</button><button class="btn blue" onclick="es('${typeObj[0]}')">🔊</button></div></div>`);sh(letters).forEach(l=>{let b=document.createElement('button');b.className='chip';b.textContent=l;b.onclick=()=>{typeVal+=l;tb.textContent=typeVal};kb.appendChild(b)})}
const sp={who:[['El niño','👦'],['La niña','👧'],['El perro','🐶'],['El gato','🐱']],verb:[['come','🍎'],['mira','👀'],['lleva','🎒'],['encuentra','🔎']],thing:[['una manzana','🍎'],['un libro','📘'],['una pelota','⚽'],['un juguete','🧸']],where:[['en la casa','🏠'],['en el parque','🌳'],['en la escuela','🏫'],['en Canadá','🍁']]};let picked={};function story(){picked={};show('<div class="card"><button class="btn purple" onclick="back()">← Home</button><h2>📖 Build a Picture Story</h2><div id="sa"></div><div id="so" class="word">Pick your pictures!</div><div class="row"><button class="btn blue" onclick="es(so.textContent)">🔊 Read it</button><button class="btn green" onclick="if(Object.keys(picked).length==4)win(3)">I said it! ⭐</button></div></div>');Object.entries(sp).forEach(([k,a])=>{let h=document.createElement('h3');h.textContent=k;sa.appendChild(h);let g=document.createElement('div');g.className='grid';a.forEach(x=>{let b=document.createElement('button');b.className='btn blue';b.innerHTML=x[1]+'<br>'+x[0];b.onclick=()=>{picked[k]=x[0];so.textContent=[picked.who,picked.verb,picked.thing,picked.where].filter(Boolean).join(' ')};g.appendChild(b)});sa.appendChild(g)})}
const sentences=[{en:'The boy eats an apple.',es:['El niño','come','una manzana']},{en:'The dog drinks water.',es:['El perro','bebe','agua']},{en:'The girl reads a book.',es:['La niña','lee','un libro']},{en:'Mom eats rice.',es:['Mamá','come','arroz']},{en:'The boy plays in the house.',es:['El niño','juega','en la casa']}];let cur,built=[];function sentence(){cur=sh(sentences)[0];built=[];show(`<div class="card"><button class="btn purple" onclick="back()">← Home</button><h2>🧩 Build the Spanish Sentence</h2><div class="note">Hear the English sentence. Tap Spanish cards to hear them and build the sentence.</div><h2 class="center">${cur.en}</h2><button class="btn blue big" onclick="en('${cur.en.replace(/'/g,"\\'")}')">🔊 Hear English</button><div class="bank" id="bank"></div><div class="drop" id="drop"></div><div class="row"><button class="btn red" onclick="sentence()">Clear</button><button class="btn green" onclick="if(JSON.stringify(built)==JSON.stringify(cur.es)){win(3);sentence()}else alert('Try the order again')">Check ⭐</button><button class="btn blue" onclick="es(built.join(' '))">🔊 Hear mine</button></div></div>`);let cards=sh([...cur.es,...sh(flat().map(x=>x[0]).filter(x=>!cur.es.includes(x))).slice(0,2)]);cards.forEach(w=>{let b=document.createElement('button');b.className='chip';b.textContent=w;b.onclick=()=>{es(w);if(!b.classList.contains('used')){b.classList.add('used');built.push(w);renderDrop()}};bank.appendChild(b)})}function renderDrop(){drop.innerHTML='';built.forEach((w,i)=>{let b=document.createElement('button');b.className='chip';b.textContent=w;b.onclick=()=>{built.splice(i,1);sentence()};drop.appendChild(b)})}
function sayit(){sayTarget=sh(flat())[0];show(`<div class="card"><button class="btn purple" onclick="back()">← Home</button><h2>🎤 Say It!</h2><div class="emoji">${sayTarget[2]}</div><div class="word">${sayTarget[0]}</div><p class="center small">${sayTarget[1]}</p><button class="btn blue big" onclick="es('${sayTarget[0]}')">🔊 Hear Spanish</button><div class="recordbox"><p id="rs">Tap Record, say it, then Stop.</p><div class="row"><button class="btn red" onclick="startRec()">⏺ Record</button><button class="btn purple" onclick="stopRec()">⏹ Stop</button><button class="btn green" onclick="playRec()">▶️ Hear Me</button></div></div><div class="row" style="margin-top:10px"><button class="btn gold" onclick="speechCheck()">✨ Check pronunciation</button><button class="btn green" onclick="win();sayit()">Next →</button></div><p class="small">Speech recognition is a fun bonus, not a strict grade.</p></div>`)}async function startRec(){try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{let blob=new Blob(chunks);recUrl=URL.createObjectURL(blob);stream.getTracks().forEach(t=>t.stop());rs.textContent='Recorded! Tap Hear Me.'};recorder.start();rs.textContent='Listening…'}catch(e){rs.textContent='Microphone permission is needed.'}}function stopRec(){if(recorder&&recorder.state!='inactive')recorder.stop()}function playRec(){if(recUrl)new Audio(recUrl).play()}function speechCheck(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Auto scoring is not available in this browser. Listening back still counts!');return}let r=new SR();r.lang='es-MX';r.onresult=e=>{let heard=e.results[0][0].transcript.toLowerCase(),target=sayTarget[0].toLowerCase();if(strip(heard).includes(strip(target))||strip(target).includes(strip(heard))){win(2);alert('🌟 Great! I heard: '+heard)}else alert('Almost! I heard: '+heard+'. Listen and try again.')};r.start()}
const physical={hunt:[['Encuentra algo azul.','Find something blue.','🔵'],['Encuentra algo rojo.','Find something red.','🔴'],['Trae tres juguetes.','Bring three toys.','3️⃣']],simon:[['Simón dice: salta tres veces.','Jump three times.','🤸'],['Simón dice: toca tu cabeza.','Touch your head.','🙂'],['Simón dice: corre a la puerta.','Run to the door.','🏃']],mystery:[['Construye una casa pequeña.','Build a small house.','🏠'],['Dibuja un monstruo verde.','Draw a green monster.','👾'],['Haz una torre con cinco bloques.','Make a tower with five blocks.','🧱']]};function games(){show('<div class="card"><button class="btn purple" onclick="back()">← Home</button><h2>🎮 Games</h2><div class="grid"><button class="btn gold" onclick="phys(\'hunt\')">🔎 Hunt</button><button class="btn green" onclick="phys(\'simon\')">🕺 Simón Dice</button><button class="btn blue" onclick="practice()">⚡ Fast Pick</button><button class="btn pink" onclick="phys(\'mystery\')">🎁 Mystery</button></div></div>')}function phys(k){let x=sh(physical[k])[0];show(`<div class="card"><button class="btn purple" onclick="games()">← Games</button><div class="emoji">${x[2]}</div><h2 class="center">${x[0]}</h2><p class="center small">${x[1]}</p><button class="btn blue big" onclick="es('${x[0]}')">🔊 Hear it</button><button class="btn green big" style="margin-top:10px" onclick="win(2);games()">Done! ⭐⭐</button></div>`)}
const HOL={christmas:{t:'🎄 Christmas / Navidad',w:[['Navidad','Christmas','🎄'],['regalo','gift','🎁'],['árbol','tree','🎄'],['luces','lights','✨'],['Feliz Navidad','Merry Christmas','🎅']]},thanksgiving:{t:'🦃 Thanksgiving',w:[['pavo','turkey','🦃'],['familia','family','👨‍👩‍👦'],['comida','food','🍽️'],['gracias','thank you','🙏']]},birthday:{t:'🎂 Birthday / Cumpleaños',w:[['cumpleaños','birthday','🎂'],['pastel','cake','🍰'],['vela','candle','🕯️'],['regalo','gift','🎁'],['globo','balloon','🎈'],['Feliz cumpleaños','Happy birthday','🥳']]}};function holidays(){show('<div class="card"><button class="btn purple" onclick="back()">← Home</button><h2>🎉 Holiday Spanish</h2><div class="row"><button class="btn pink" onclick="holiday(\'christmas\')">Christmas</button><button class="btn orange" onclick="holiday(\'thanksgiving\')">Thanksgiving</button><button class="btn gold" onclick="holiday(\'birthday\')">Birthday</button></div><div id="hp"></div></div>');holiday('christmas')}function holiday(k){let h=HOL[k];hp.innerHTML='<h3>'+h.t+'</h3><div class="grid" id="hg"></div>';h.w.forEach(w=>{let b=document.createElement('button');b.className='btn blue';b.innerHTML=w[2]+'<br>'+w[0]+'<div class="small">'+w[1]+'</div>';b.onclick=()=>es(w[0]);hg.appendChild(b)})}
const CM=[['Di a Bubba: Hola, ¿cómo estás?','Say to Bubba: Hi, how are you?','👋'],['Dale a Bubba un bloque rojo y di: rojo.','Give Bubba a red block and say red.','🧱'],['Construye una casa con Bubba.','Build a house with Bubba.','🏠'],['Pregunta: ¿Quieres jugar?','Ask: Do you want to play?','🎮'],['Cuenta cinco bloques con Bubba en español.','Count five blocks with Bubba in Spanish.','5️⃣'],['Di: Tengo frío.','Say: I am cold.','🥶'],['Di: Quiero agua, por favor.','Say: I want water, please.','💧']];function canada(){let x=sh(CM)[0];show(`<div class="card"><button class="btn purple" onclick="back()">← Home</button><h2>🍁 Canada Adventure with Bubba</h2><div class="emoji">${x[2]}</div><h2 class="center">${x[0]}</h2><p class="center small">${x[1]}</p><div class="row"><button class="btn blue" onclick="es('${x[0]}')">🔊 Hear it</button><button class="btn green" onclick="win(2);canada()">Done! ⭐⭐</button><button class="btn purple" onclick="canada()">New mission</button></div></div>`)}
const V=[['🎨','Colors','https://www.youtube.com/results?search_query=Calico+Spanish+colors+for+kids'],['🔢','Numbers','https://www.youtube.com/results?search_query=Super+Simple+Espa%C3%B1ol+numbers+1+10'],['🏃','Verbs','https://www.youtube.com/results?search_query=Basho+and+Friends+Spanish+verbs+kids'],['🌦️','Weather','https://www.youtube.com/results?search_query=Spanish+weather+for+kids+beginner'],['🍎','Food','https://www.youtube.com/results?search_query=Spanish+food+vocabulary+for+kids+song'],['🎄','Christmas','https://www.youtube.com/results?search_query=Spanish+Christmas+vocabulary+for+kids']];function videos(){show('<div class="card"><button class="btn purple" onclick="back()">← Home</button><h2>▶️ Spanish Video Time</h2><div class="note">Watch one short video, then practice the same topic.</div><div id="vl"></div></div>');V.forEach(v=>{let d=document.createElement('div');d.className='video';d.innerHTML=`<div style="font-size:2rem">${v[0]}</div><div class="grow"><b>${v[1]}</b></div><button class="btn blue">Watch</button>`;d.querySelector('button').onclick=()=>window.open(v[2],'_blank');vl.appendChild(d)})}
function prizes(){show('<div class="card"><button class="btn purple" onclick="back()">← Home</button><h2>🎁 Prize Shop</h2><p>You have <b>⭐ '+S+'</b></p><div id="pl"></div></div>');prizeList.forEach((p,i)=>{let d=document.createElement('div');d.className='shop';d.innerHTML=`<b>${p.n}</b><span>⭐ ${p.c}</span><button class="btn green">Redeem</button>`;d.querySelector('button').onclick=()=>{if(S<p.c)return alert('Need more stars!');if(confirm('Grown-up check: redeem this prize?')){S-=p.c;save();prizes()}};pl.appendChild(d)})}function parent(){show('<div class="card"><button class="btn purple" onclick="back()">← Home</button><h2>👩‍👦 Parent Mode</h2><div class="note">Best rhythm: 3–5 new words → say them → one game → stop while it is still fun.</div><h3>Add a prize</h3><input id="pn" class="field" placeholder="Prize name"><input id="pc" class="field" type="number" placeholder="Star cost"><button class="btn green big" onclick="if(pn.value&&pc.value){prizeList.push({n:pn.value,c:Number(pc.value)});save();parent()}">Add prize</button><div id="pedit"></div></div>');prizeList.forEach((p,i)=>{let d=document.createElement('div');d.className='shop';d.innerHTML=`<span>${p.n} — ⭐ ${p.c}</span><button class="btn red">Delete</button>`;d.querySelector('button').onclick=()=>{prizeList.splice(i,1);save();parent()};pedit.appendChild(d)})}
function daily(){let k=sh(Object.keys(vocab))[0];alert('Today: learn a few '+k+' words, then do Say It, then play a game. ⭐');lesson(k,0)}
</script></body></html>
